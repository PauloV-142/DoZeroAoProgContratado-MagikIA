<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MagikIA</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="scr/css/principal.css">
        <link rel="stylesheet" href="scr/css/adicionar.css">
        <!-- <link rel="stylesheet" href="dev.css"> -->
    </head>
    <body>
        <header class="cabecalho">
            <div class="esquerda"></div>
            <div class="centro"><img src="scr/images/logo.png" alt="MagikIA"></div>
            <div class="direita"><button id="alterna-modo"></button></div>
        </header>
        <div class="exterior">
            <main class="container">
                <h1 class="titulo">Adicionar carta</h1>
                <form action="enviar.js" method="POST" class="">
                    <div class="carta">
                        <img src="scr/images/carta-arkanon.png" alt="Sua Carta" id="carta-imagem"/>
                        <div class="informacoes">
                            <h2 class="nome-personagem" id="carta-nome">Arkanon</h2>
                            <span class="categoria" id="carta-categoria">Categoria: Épica</span>
                            <span class="preco" id="carta-preco">R$ 3000,00</span>
                            <button class="botao btn-comprar">Comprar</button>
                        </div>
                    </div>
                    <div class="adicionar coluna">
                        <div class="adicionar-nome coluna">
                            <label for="input-nome">Nome do personagem</label>
                            <input class="nome input" id="input-nome" type="text" oninput="atualizar('input-nome', 'carta-nome')">
                        </div>
                        <div class="adicionar-categoria coluna">
                            <label for="input-categoria">Categoria</label>
                            <select name="categoria" class="categoria input" id="input-categoria" oninput="atualizar('input-categoria', 'carta-categoria')">
                                <option value="">Selecione</option>
                                <option value="Comum">Comum</option>
                                <option value="Épica">Épica</option>
                            </select>
                        </div>
                        <div class="adicionar-preco coluna">
                            <label for="input-preco">Preço (R$)</label>
                            <input class="preco input" id="input-preco" type="number" value="800" oninput="atualizar('input-preco', 'carta-preco')">
                        </div>
                        <div class="adicionar-imagem coluna">
                            <label for="imagem-upload">Imagem</label>
                            <input class="imagem-upload" id="input-imagem" type="file" oninput="atualizarImagem()">
                        </div>
                    </div>
                </form>
            </main>
            <div class="sidebar">
                <h1>Suas Cartas</h1>
            </div>
        </div>
        <footer class="rodape">@2025 - Todos os direitos reservados</footer>
        <script src="scr/js/modoescuro.js"></script>
        <script src="scr/js/adicionar.js"></script>
    </body>
</html>
